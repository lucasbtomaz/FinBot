name: Validacao
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Validar Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Conferir arquivos publicaveis
        shell: pwsh
        run: ./scripts/check-publication.ps1
      - name: Verificar segredos localmente
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
      - run: npm.cmd --prefix src/finbot-ui ci
      - run: ./scripts/audit-dependencies.ps1
      - run: npm.cmd --prefix src/finbot-ui run build
      - run: dotnet test FinBot.slnx --configuration Release
      - run: dotnet build tests/FinBot.Driver --configuration Release
      - name: Preparar capturas sinteticas
        shell: pwsh
        run: New-Item -ItemType Directory -Force UX/capturas
      - run: npm.cmd --prefix src/finbot-ui run test:e2e
